services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sustainability
      POSTGRES_USER: sustainability
      POSTGRES_PASSWORD: sustainability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sustainability:sustainability@postgres:5432/sustainability
    depends_on:
      - postgres

volumes:
  postgres-data:
